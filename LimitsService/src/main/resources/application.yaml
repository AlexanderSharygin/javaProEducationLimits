server:
  port: 8080

scheduler:
  drop_limits_cron: 0 0 0 * * ?

spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/limits
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    org.flywaydb: WARN
    org.springframework.jdbc.core: WARN
    org.springframework.boot.autoconfigure.flyway: WARN